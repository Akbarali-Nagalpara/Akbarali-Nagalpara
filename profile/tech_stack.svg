    <text x="630" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#8b949e" text-anchor="start">Tools</text>
    <text x="630" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="normal" fill="#c9d1d9" text-anchor="start">Git</text>
    <text x="630" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="normal" fill="#c9d1d9" text-anchor="start">GitHub</text>
    <text x="630" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="normal" fill="#c9d1d9" text-anchor="start">Apache</text>
